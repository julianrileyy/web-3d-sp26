<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Julian Riley - Portfolio</title>
  <meta name="description" content="Julian Riley — Portfolio of physical works, digital works, and photography." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="canvas"></canvas>

  <!-- grain-->
  <div id="grain" aria-hidden="true"></div>

  <!-- homepage overlay -->
  <div id="homepage-overlay" >
    <div id="home-content">
      <span class="home-label">Portfolio</span>

      <h1 id="home-name">Julian<br>Riley</h1>

      <p class="home-tagline">Physical Works &nbsp;·&nbsp; Digital Works &nbsp;·&nbsp; Photography</p>

      <p class="home-contact">JulianJJRiley@gmail.com &nbsp; · &nbsp; 757-761-2860</p>

      <div class="scroll-hint" >
        <span>Scroll to navigate</span>
        <!-- right arrow -->
        <svg viewBox="0 0 28 14" aria-hidden="true">
          <polyline points="21,1 27,7 21,13"/>
          <line x1="1" y1="7" x2="27" y2="7"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- text -->
  <div id="overlay" aria-live="polite"></div>

  <!-- progress -->
  <div id="progress-bar" role="progressbar" aria-label="Scroll progress">
    <div id="progress-fill"></div>
  </div>

  <!-- bottom right corner -->
  <div id="corner-label">
    Contact<span>Works</span>
  </div>

   <script type="module" src="works.js"></script>
  <script type="module" src="main.js"></script>

</body>
</html>
