<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Project 2: Plinko</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="host">

  <!-- phone join -->
  <div id="joinCard">
    <div class="jtitle">Join from your phone</div>
    <div id="joinCode">····</div>
    <div id="joinUrl"></div>
    <div id="qr"></div>
    <div id="status" class="bad">Connecting…</div>
  </div>

  <!--players + pucks dropped -->
  <div id="players"></div>

  <!--  pop-up 15 pucks -->
  <div id="popup">
    <div id="popImg"></div>
    <div id="popName" class="fancy"></div>
    <div id="popSub"></div>
  </div>

  <!-- start screen -->
  <div id="startOverlay">
    <h1>Plinko</h1>
    <p>Select your character! </p>
    <p class="small">( ͡° ͜ʖ ͡°)</p>
    <div id="hostGrid" class="char-grid"></div>
    <button id="startBtn" class="btn">Start!</button>
  </div>

  <script src="lib/p5.min.js"></script>
  <script src="lib/peerjs.min.js"></script>
  <script src="lib/qrcode.js"></script>
  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script src="host.js"></script>
</body>
</html>
