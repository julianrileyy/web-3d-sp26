<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Plinko Garden — Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="phone">

  <!-- upper right: this player's pucks dropped -->
  <div id="countBox" hidden>🌸 Pucks: <span id="countNum">0</span></div>
  <div id="meBox" hidden></div>
  <div id="banner" hidden></div>

  <main id="app">

    <!-- 1. enter the game code -->
    <section id="scrJoin" class="screen active">
      <h1>Plinko Garden</h1>
      <p>Enter the game code from the big screen</p>
      <input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE">
      <div><button id="joinBtn" class="btn">Join</button></div>
      <p id="joinMsg"></p>
    </section>

    <!-- 2. pick a character -->
    <section id="scrChar" class="screen">
      <h2>Pick your character</h2>
      <div id="charGrid" class="char-grid"></div>
      <button id="goBtn" class="btn" disabled>Let's play! 🦋</button>
    </section>

    <!-- 3. spin the wheel -->
    <section id="scrGame" class="screen">
      <h2>Spin the wheel!</h2>
      <div id="wheelWrap">
        <div id="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
      </div>
      <button id="spinBtn" class="btn" disabled>Waiting for host…</button>
      <div id="result"></div>
    </section>

  </main>

  <script src="lib/peerjs.min.js"></script>
  <script src="config.js"></script>
  <script src="shared.js"></script>
  <script src="play.js"></script>
</body>
</html>
