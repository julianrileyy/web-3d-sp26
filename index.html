<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JJ Cathcart — Studio Art</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    /* ── VARIABLES ─────────────────────────────────────────────────────── */
    :root {
      --bg:      #0c0b09;
      --cream:   #eee8dc;
      --wine:    #7d2030;
      --charcoal:#1e1c19;
      --muted:   #7a7470;
      --dim:     #3a3733;
      --font-display: "Bebas Neue", sans-serif;
      --font-body:    "DM Mono", monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--cream);
      font-family: var(--font-body);
      cursor: grab;
      user-select: none;
    }
    body:active { cursor: grabbing; }

    #canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }

    /* grain */
    #grain {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 10;
      opacity: 0.32;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      mix-blend-mode: overlay;
    }

    /* homepage */
    #homepage-overlay {
      position: fixed; inset: 0; z-index: 20;
      pointer-events: none;
      display: flex; align-items: center;
      justify-content: flex-start;
      padding-left: 8vw;
      transition: opacity 0.1s linear;
    }
    #home-content { display: flex; flex-direction: column; gap: 1.1rem; }
    .home-label {
      font-family: var(--font-body);
      font-size: 0.68rem; letter-spacing: 0.28em;
      text-transform: uppercase; color: var(--wine);
    }
    #home-name {
      font-family: var(--font-display);
      font-size: clamp(5rem, 13vw, 13rem);
      line-height: 0.88; color: var(--cream);
    }
    .home-tagline {
      font-size: 0.68rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--muted);
    }
    .home-contact { font-size: 0.62rem; color: var(--dim); letter-spacing: 0.1em; }
    .scroll-hint {
      display: flex; align-items: center; gap: 0.7rem;
      margin-top: 2rem; font-size: 0.62rem;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim);
      animation: pulse 2.5s ease-in-out infinite;
    }
    .scroll-hint svg {
      width: 28px; height: 14px;
      stroke: var(--wine); stroke-width: 1.5;
      fill: none; stroke-linecap: round; stroke-linejoin: round;
      animation: arrow 2.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
    @keyframes arrow { 0%,100%{transform:translateX(0)} 50%{transform:translateX(6px)} }

    /* work text */
    #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
    .work-text {
      position: absolute; top: 0; left: 0;
      width: 330px; padding: 1.3rem 0 0 0;
      transition: opacity 0.2s ease;
      border-top: 1px solid var(--charcoal);
    }
    .work-index {
      font-size: 0.58rem; letter-spacing: 0.3em;
      color: var(--wine); margin-bottom: 0.5rem;
    }
    .work-title {
      font-family: var(--font-display);
      font-size: 2.2rem; line-height: 1;
      color: var(--cream); margin-bottom: 0.45rem;
    }
    .work-meta {
      font-size: 0.6rem; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem;
    }
    .work-desc {
      font-size: 0.7rem; line-height: 1.75;
      color: var(--dim); max-width: 290px; font-style: italic;
    }

    /* progress */
    #progress-bar {
      position: fixed; bottom: 0; left: 0;
      width: 100%; height: 1px;
      background: var(--charcoal); z-index: 30;
    }
    #progress-fill {
      height: 100%; background: var(--wine);
      width: 0%; transition: width 0.05s linear;
    }

    /* corner */
    #corner-label {
      position: fixed; bottom: 1.4rem; right: 2rem;
      z-index: 30; font-size: 0.56rem; letter-spacing: 0.26em;
      text-transform: uppercase; color: var(--dim); pointer-events: none;
    }
    #corner-label span { color: var(--wine); }

    @media (max-width: 600px) {
      #home-name { font-size: 4.2rem; }
      .work-text { width: 250px; }
      .work-title { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="grain" aria-hidden="true"></div>

<div id="homepage-overlay">
  <div id="home-content">
    <span class="home-label">Portfolio</span>
    <h1 id="home-name">JJ<br>Cathcart</h1>
    <p class="home-tagline">Physical Works &nbsp;·&nbsp; Series &nbsp;·&nbsp; Photography</p>
    <p class="home-contact">juliancathcart@gmail.com &nbsp;·&nbsp; 757-761-2860</p>
    <div class="scroll-hint">
      <span>Scroll to explore</span>
      <svg viewBox="0 0 28 14"><polyline points="21,1 27,7 21,13"/><line x1="1" y1="7" x2="27" y2="7"/></svg>
    </div>
  </div>
</div>

<div id="overlay"></div>

<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="corner-label">CatJJ<span>Art</span></div>

<!-- Three.js global build (no import/export — works from file://) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.min.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  ✏️  EDIT YOUR WORKS HERE
// ═══════════════════════════════════════════════════════════════════════════

const WORKS = [
  {
    title:       "Work Title One",
    year:        "2024",
    medium:      "Oil on Canvas",
    description: "A brief description of the work and its conceptual context.",
    image:       "./assets/images/work-1.jpg",
  },
  {
    title:       "Work Title Two",
    year:        "2024",
    medium:      "Photography",
    description: "A brief description of the work and its conceptual context.",
    image:       "./assets/images/work-2.jpg",
  },
  {
    title:       "Work Title Three",
    year:        "2023",
    medium:      "Mixed Media",
    description: "A brief description of the work and its conceptual context.",
    image:       "./assets/images/work-3.jpg",
  },
  {
    title:       "Work Title Four",
    year:        "2023",
    medium:      "Series",
    description: "A brief description of the work and its conceptual context.",
    image:       "./assets/images/work-4.jpg",
  },
  {
    title:       "Work Title Five",
    year:        "2022",
    medium:      "Photography",
    description: "A brief description of the work and its conceptual context.",
    image:       "./assets/images/work-5.jpg",
  },
];

// ═══════════════════════════════════════════════════════════════════════════
//  ✏️  SITE CONFIG
// ═══════════════════════════════════════════════════════════════════════════

const CONFIG = {
  name:    "JJ Cathcart",
  label:   "Studio Art",
  tagline: "Physical Works · Series · Photography",
  email:   "juliancathcart@gmail.com",
  phone:   "757-761-2860",
};

// ═══════════════════════════════════════════════════════════════════════════
//  SCROLL TUNING  (tweak these to change scroll feel)
// ═══════════════════════════════════════════════════════════════════════════

const PANEL_SPACING  = 11;      // world-units between panels
const FIRST_PANEL_X  = 11;      // x-position of first panel
const CAMERA_Z       = 9;       // camera distance
const LERP_SPEED     = 0.08;    // smoothing (lower = silkier)
const DRAG_SCALE     = 0.022;   // mouse drag sensitivity
const WHEEL_SCALE    = 0.018;   // scroll wheel sensitivity
const INERTIA_DECAY  = 0.87;    // momentum friction (0.8=short, 0.95=long)

// ═══════════════════════════════════════════════════════════════════════════
//  SCENE SETUP
// ═══════════════════════════════════════════════════════════════════════════

const MAX_X = FIRST_PANEL_X + (WORKS.length - 1) * PANEL_SPACING + 4;

let W = window.innerWidth;
let H = window.innerHeight;

const canvas   = document.getElementById("canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.setClearColor(0x0c0b09);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, W / H, 0.1, 300);
camera.position.set(0, 0, CAMERA_Z);

const texLoader = new THREE.TextureLoader();

// ── HELPERS ────────────────────────────────────────────────────────────────

function makePlane(w, h, color, opts) {
  return new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color, ...opts })
  );
}

// ── SUBTLE HORIZONTAL RULES ────────────────────────────────────────────────

for (let y = -7; y <= 7; y += 3.5) {
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-4, y, -2),
    new THREE.Vector3(400, y, -2),
  ]);
  scene.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: 0x181613, transparent: true, opacity: 1
  })));
}

// ── HOMEPAGE STAR + RINGS ──────────────────────────────────────────────────

function starShape(outerR, innerR, pts) {
  const s = new THREE.Shape();
  const step = Math.PI / pts;
  for (let i = 0; i < pts * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const a = i * step - Math.PI / 2;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i === 0 ? s.moveTo(x, y) : s.lineTo(x, y);
  }
  s.closePath();
  return s;
}

const ss      = starShape(3.2, 1.35, 5);
const starGeo = new THREE.ShapeGeometry(ss);

const starFill = new THREE.Mesh(starGeo,
  new THREE.MeshBasicMaterial({ color: 0x7d2030, transparent: true, opacity: 0.09 }));
starFill.position.set(0, 0, -1.5);
scene.add(starFill);

const starEdge = new THREE.LineSegments(
  new THREE.EdgesGeometry(starGeo),
  new THREE.LineBasicMaterial({ color: 0x7d2030, transparent: true, opacity: 0.5 })
);
starEdge.position.set(0, 0, -1.4);
scene.add(starEdge);

[
  [3.9, 3.97, 0.45],
  [5.1, 5.16, 0.22],
  [6.5, 6.55, 0.12],
].forEach(([inner, outer, op]) => {
  const m = new THREE.Mesh(
    new THREE.RingGeometry(inner, outer, 80),
    new THREE.MeshBasicMaterial({ color: 0x7d2030, transparent: true, opacity: op, side: THREE.DoubleSide })
  );
  m.position.set(0, 0, -1.5);
  scene.add(m);
});

// ── WORK PANELS ────────────────────────────────────────────────────────────

const panelData = [];

WORKS.forEach((work, i) => {
  const x = FIRST_PANEL_X + i * PANEL_SPACING;

  // Drop shadow
  const shadow = makePlane(6.35, 8.2, 0x060504);
  shadow.position.set(x + 0.2, -0.2, -0.08);
  scene.add(shadow);

  // Border
  const border = makePlane(6.25, 8.1, 0x1e1c19);
  border.position.set(x, 0, -0.02);
  scene.add(border);

  // Cream background
  const bg = makePlane(6.0, 7.85, 0xeee8dc);
  bg.position.set(x, 0, 0);
  scene.add(bg);

  // Image plane
  const imgGeo = new THREE.PlaneGeometry(5.5, 5.8);
  let imgMat;

  try {
    const tex = texLoader.load(work.image);
    tex.colorSpace = THREE.SRGBColorSpace;
    imgMat = new THREE.MeshBasicMaterial({ map: tex });
  } catch(e) {
    imgMat = new THREE.MeshBasicMaterial({ color: 0x2a2825 });
  }

  const imgMesh = new THREE.Mesh(imgGeo, imgMat);
  imgMesh.position.set(x, 0.95, 0.01);
  scene.add(imgMesh);

  // Placeholder crosshair lines (visible only if image fails to load)
  [[0, 1.45, 0, -1.45], [-1.45, 0, 1.45, 0]].forEach(([x1, y1, x2, y2]) => {
    const g = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x + x1, 0.95 + y1, 0.02),
      new THREE.Vector3(x + x2, 0.95 + y2, 0.02),
    ]);
    scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({
      color: 0x4a4844, transparent: true, opacity: 0.3
    })));
  });

  // HTML label div
  const div = document.createElement("div");
  div.className = "work-text";
  div.innerHTML = `
    <div class="work-index">0${i + 1}</div>
    <h2 class="work-title">${work.title}</h2>
    <p class="work-meta">${work.year}&nbsp;&nbsp;/&nbsp;&nbsp;${work.medium}</p>
    <p class="work-desc">${work.description}</p>
  `;
  document.getElementById("overlay").appendChild(div);
  panelData.push({ div, worldX: x, worldY: -4.55 });
});

// ═══════════════════════════════════════════════════════════════════════════
//  SCROLL STATE
// ═══════════════════════════════════════════════════════════════════════════

let targetX  = 0;
let currentX = 0;
let velocity = 0;

// ── MOUSE WHEEL ────────────────────────────────────────────────────────────

window.addEventListener("wheel", (e) => {
  e.preventDefault();
  velocity += (e.deltaY + e.deltaX) * WHEEL_SCALE;
}, { passive: false });

// ── MOUSE DRAG ─────────────────────────────────────────────────────────────

let isDragging   = false;
let dragPrevX    = 0;
let dragVelocity = 0;

window.addEventListener("mousedown", (e) => {
  isDragging   = true;
  dragPrevX    = e.clientX;
  dragVelocity = 0;
  velocity     = 0;
  document.body.style.cursor = "grabbing";
});

window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  const dx      = (e.clientX - dragPrevX) * DRAG_SCALE;
  dragVelocity  = -dx;
  targetX       = Math.max(0, Math.min(MAX_X, targetX - dx));
  dragPrevX     = e.clientX;
});

function endDrag() {
  if (!isDragging) return;
  velocity   = dragVelocity * 2.8;
  isDragging = false;
  document.body.style.cursor = "grab";
}

window.addEventListener("mouseup",    endDrag);
window.addEventListener("mouseleave", endDrag);

// ── TOUCH ──────────────────────────────────────────────────────────────────

let touchPrevX    = 0;
let touchVelocity = 0;

window.addEventListener("touchstart", (e) => {
  touchPrevX    = e.touches[0].clientX;
  touchVelocity = 0;
  velocity      = 0;
}, { passive: true });

window.addEventListener("touchmove", (e) => {
  e.preventDefault();
  const dx      = (e.touches[0].clientX - touchPrevX) * DRAG_SCALE;
  touchVelocity = -dx;
  targetX       = Math.max(0, Math.min(MAX_X, targetX - dx));
  touchPrevX    = e.touches[0].clientX;
}, { passive: false });

window.addEventListener("touchend", () => { velocity = touchVelocity * 3; });

// ── RESIZE ─────────────────────────────────────────────────────────────────

window.addEventListener("resize", () => {
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

// ═══════════════════════════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════════════════

const tempVec      = new THREE.Vector3();
const progressFill = document.getElementById("progress-fill");
const homeOverlay  = document.getElementById("homepage-overlay");
const clock        = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();

  // Apply inertia to targetX
  if (!isDragging) {
    velocity *= INERTIA_DECAY;
    targetX   = Math.max(0, Math.min(MAX_X, targetX + velocity));
  }

  // Smooth camera
  currentX          += (targetX - currentX) * LERP_SPEED;
  camera.position.x  = currentX;

  // Spin homepage star
  starFill.rotation.z  = t * 0.07;
  starEdge.rotation.z  = t * 0.07;

  // Sync overlays
  homeOverlay.style.opacity = Math.max(0, 1 - currentX / 5).toFixed(3);

  panelData.forEach(({ div, worldX, worldY }) => {
    tempVec.set(worldX, worldY, 0).project(camera);
    const sx = ( tempVec.x * 0.5 + 0.5) * W;
    const sy = (-tempVec.y * 0.5 + 0.5) * H;
    div.style.transform = `translate(-50%, 0) translate(${sx}px, ${sy}px)`;
    const dist = Math.abs(sx - W * 0.5) / (W * 0.5);
    div.style.opacity = Math.max(0, 1 - dist * 1.35).toFixed(3);
  });

  progressFill.style.width = `${(currentX / MAX_X * 100).toFixed(1)}%`;

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
